name: Contrôle Matinal SLA SURETIX

on:
  schedule:
    # 20:00 UTC = 07:00 Heure de Nouméa (UTC+11)
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  check-sla:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code repository
        uses: actions/checkout@v3

      - name: Configuration de l'environnement Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          pip install supabase streamlit

      - name: Exécution du contrôle matinal SLA & Envoi Mail
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python -c "
          import sys
          from pathlib import Path
          sys.path.append(str(Path('.').resolve()))

          from utils.relance_services import get_incidents_a_relancer
          from utils.email_services import envoyer_notification_relance_sla

          print('🔍 Analyse matinale des SLA SURETIX...')
          incidents = get_incidents_a_relancer()

          if incidents:
              print(f'🚨 {len(incidents)} incident(s) en souffrance détecté(s). Envoi du rapport...')
              envoyer_notification_relance_sla(incidents, recipient_email='eric.kuter@gouv.nc')
              print('✅ Email d\'alerte transmis avec succès.')
          else:
              print('✅ Aucun incident en souffrance ce matin. SLA conformes.')
          "